<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derek Pham: Contact</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../global.js"></script>
  </head>
  <body>
    <main>
      <h1>Contact</h1>
      <form action="mailto:your-email@example.com">
        <label>
          <span>Your email</span>
          <input type="email" name="email" value="you@example.com" />
        </label>
        <label>
          <span>Subject</span>
          <input name="subject" value="Hello from your portfolio site" />
        </label>
        <label>
          <span>Message</span>
          <textarea name="body">Hi Derek, </textarea>
        </label>
        <button>Send</button>
      </form>
    </main>
  </body>
</html>
