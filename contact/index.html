      <h1>Contact</h1>
      <form action="mailto:your-email@example.com" method="POST" enctype="text/plain">
        <p>
          <label>Your email

        <p>
          <label>Subject

        </p>
        <p>
          <label>Message

          </label>
        </p>
        <button>Send</button>
      </form>
    </main>
